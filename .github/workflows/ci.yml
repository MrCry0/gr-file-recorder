name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["*"]

env:
  UV_VERSION: "0.11"

jobs:
  # --------------------------------------------------- commit messages
  commit-check:
    name: Commit messages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 .github/scripts/check-commits.py \
              "origin/${{ github.base_ref }}..${{ github.sha }}"
          else
            python3 .github/scripts/check-commits.py "HEAD~1..HEAD"
          fi

  # ------------------------------------------------------------ lint
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          cache-dependency-glob: pyproject.toml
      - run: uv venv --system-site-packages
      - run: uv pip install -e '.[dev]'
      - run: uv run ruff check .

  # ------------------------------------------- tests / Ubuntu 24.04
  test-ubuntu:
    name: Test / Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gnuradio \
            python3-pyqt5 \
            libxkbcommon-x11-0 \
            libegl1

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          cache-dependency-glob: pyproject.toml

      - name: Create venv and install package
        run: |
          uv venv --system-site-packages
          uv pip install -e '.[dev]'

      - name: Run tests
        run: uv run pytest -v --tb=short
        env:
          QT_QPA_PLATFORM: offscreen

  # ---------------------------------------------- tests / Fedora 42
  test-fedora:
    name: Test / Fedora 42
    runs-on: ubuntu-24.04
    container:
      image: fedora:42
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y \
            git \
            gnuradio \
            python3-qt5 \
            python3-numpy \
            python3-pip \
            libxkbcommon-x11 \
            mesa-libGL

      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          cache-dependency-glob: pyproject.toml

      - name: Create venv and install package
        run: |
          uv venv --system-site-packages
          uv pip install -e '.[dev]'

      - name: Run tests
        run: uv run pytest -v --tb=short
        env:
          QT_QPA_PLATFORM: offscreen

  # ---------------------------------- Debian package / Ubuntu 24.04
  package-deb:
    name: Package / deb (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    needs: [test-ubuntu]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract package version
        run: |
          VERSION=$(python3 -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "PKG_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            debhelper \
            dh-python \
            pybuild-plugin-pyproject \
            python3-all \
            python3-setuptools \
            devscripts

      - name: Build deb package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect artifacts
        run: mkdir -p dist && cp ../*.deb dist/

      - uses: actions/upload-artifact@v7
        with:
          name: gr-file-recorder_${{ env.PKG_VERSION }}-1
          path: dist/*.deb
          retention-days: 30

  # ---------------------------------------- RPM package / Fedora 42
  package-rpm:
    name: Package / rpm (Fedora 42)
    runs-on: ubuntu-24.04
    container:
      image: fedora:42
    needs: [test-fedora]
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y \
            git \
            rpm-build \
            rpmdevtools \
            python3-devel \
            python3-setuptools \
            python3-pip \
            python3-wheel \
            pyproject-rpm-macros

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build RPM and SRPM
        run: |
          git config --global --add safe.directory '*'
          VERSION=$(python3 -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "PKG_VERSION=$VERSION" >> $GITHUB_ENV
          rpmdev-setuptree
          git archive \
            --format=tar.gz \
            --prefix=gr-file-recorder-${VERSION}/ \
            -o ~/rpmbuild/SOURCES/gr-file-recorder-${VERSION}.tar.gz \
            HEAD
          rpmbuild -ba gr-file-recorder.spec \
            --define "pkgversion ${VERSION}"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp ~/rpmbuild/RPMS/noarch/*.rpm dist/
          cp ~/rpmbuild/SRPMS/*.rpm dist/

      - uses: actions/upload-artifact@v7
        with:
          name: gr-file-recorder-${{ env.PKG_VERSION }}-1.fc42
          path: dist/*.rpm
          retention-days: 30

  # --------------------------------------------------------- release
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [commit-check, lint, test-ubuntu, test-fedora, package-deb, package-rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract package version
        run: |
          VERSION=$(python3 -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "PKG_VERSION=$VERSION" >> $GITHUB_ENV

      - uses: actions/download-artifact@v8
        with:
          name: gr-file-recorder_${{ env.PKG_VERSION }}-1
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: gr-file-recorder-${{ env.PKG_VERSION }}-1.fc42
          path: dist/

      - name: Build source archive
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          git archive \
            --format=tar.gz \
            --prefix=gr-file-recorder-${VERSION}/ \
            -o dist/gr-file-recorder-${VERSION}.tar.gz \
            HEAD

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          NOTES=$(git tag -l --format='%(contents)' "$TAG")
          gh release create "$TAG" \
            dist/* \
            --title "$TAG" \
            --notes "${NOTES:-Release $TAG}"
